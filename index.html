<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turf Tracker</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root {
    --bg: #14161a; --panel: #1c1f25; --panel-2: #23272f; --line: #2f343d;
    --text: #e6e8eb; --muted: #8b93a0; --accent: #4f8cff;
    --good: #3fb765; --warn: #d9a21b; --bad: #e5484d;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
         font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; align-items: center; justify-content: space-between; gap: 12px;
           padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .who { display: flex; align-items: center; gap: 8px; color: var(--muted); }
  input, select, textarea, button { font: inherit; color: inherit; }
  input, select, textarea { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; width: 100%; }
  input:focus, select:focus, textarea:focus { outline: 1px solid var(--accent); border-color: var(--accent); }
  .who input { width: 140px; }
  button { background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 7px 12px; cursor: pointer; }
  button:hover { border-color: var(--muted); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  button.danger { color: var(--bad); }
  button.small { padding: 3px 9px; font-size: 12px; }
  main { flex: 1; display: flex; min-height: 0; }
  #mapWrap { flex: 1; position: relative; min-width: 0; }
  #map { position: absolute; inset: 0; background: #0f1115; cursor: grab; }
  #map.drawing { cursor: crosshair; }
  #drawBar { position: absolute; top: 12px; left: 50%; transform: translateX(-50%); z-index: 1000; display: none;
             gap: 8px; align-items: center; background: var(--panel); border: 1px solid var(--line);
             padding: 8px 12px; border-radius: 8px; }
  #drawBar.on { display: flex; }
  aside { width: 380px; display: flex; flex-direction: column; background: var(--panel); border-left: 1px solid var(--line); }
  nav { display: flex; border-bottom: 1px solid var(--line); }
  nav button { flex: 1; border: 0; border-radius: 0; background: none; padding: 11px 6px; color: var(--muted); border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab { flex: 1; overflow-y: auto; padding: 14px; display: none; }
  .tab.active { display: block; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .muted { color: var(--muted); font-size: 12px; }
  .card { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 8px; }
  .card.sel { border-color: var(--accent); }
  .card.click { cursor: pointer; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
  .bar { height: 6px; background: var(--bg); border-radius: 3px; overflow: hidden; margin-top: 6px; }
  .bar i { display: block; height: 100%; }
  .actions { display: flex; gap: 6px; margin-top: 8px; }
  .task { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; border-top: 1px solid var(--line); }
  .task:first-of-type { border-top: 0; }
  .task button { min-width: 96px; }
  .task button.done { background: var(--good); border-color: var(--good); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; padding-top: 3px; }
  .chip { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 1px 8px; font-size: 12px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  label { display: block; margin: 10px 0 4px; font-size: 12px; color: var(--muted); }
  dialog { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 10px; padding: 18px; width: min(400px, 92vw); }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { margin: 0 0 4px; }
  .dlg-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--panel-2); border: 1px solid var(--line);
           padding: 8px 14px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 3000; }
  #toast.on { opacity: 1; }
  .leaflet-tooltip { background: var(--panel); color: var(--text); border-color: var(--line); }
  @media (max-width: 800px) {
    main { flex-direction: column; }
    #mapWrap { flex: none; height: 42vh; }
    aside { width: 100%; flex: 1; border-left: 0; border-top: 1px solid var(--line); min-height: 0; }
  }
</style>
</head>
<body>

<header>
  <h1>Turf Tracker</h1>
  <div class="who">
    <span id="syncState" class="muted"></span>
    <label for="userName" style="margin:0">Playing as</label>
    <input id="userName" placeholder="Your name" maxlength="24">
  </div>
</header>

<main>
  <div id="mapWrap">
    <div id="map"></div>
    <div id="drawBar">
      <span id="drawCount">0 points</span>
      <button class="small" id="drawUndo">Undo</button>
      <button class="small primary" id="drawFinish">Finish</button>
      <button class="small" id="drawCancel">Cancel</button>
    </div>
  </div>

  <aside>
    <nav id="tabs">
      <button data-tab="turfs" class="active">Turfs</button>
      <button data-tab="daily">Daily checklist</button>
      <button data-tab="log">Activity</button>
      <button data-tab="data">Data</button>
    </nav>

    <section class="tab active" id="tab-turfs">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">Turfs (<span id="turfCount">0</span>)</h2>
        <button class="small" id="drawStart">+ Draw turf</button>
      </div>
      <div id="turfList"></div>
    </section>

    <section class="tab" id="tab-daily">
      <div class="row" style="margin-bottom:10px">
        <h2 style="margin:0">Checklist</h2>
        <input type="date" id="dayPick" style="width:auto">
      </div>
      <p class="muted" id="daySummary"></p>
      <div id="dailyList"></div>
    </section>

    <section class="tab" id="tab-log">
      <h2>Recent activity</h2>
      <div id="logList"></div>
    </section>

    <section class="tab" id="tab-data">
      <h2>Backup</h2>
      <p class="muted">Download everything as a JSON file, or restore from one.</p>
      <div class="actions">
        <button id="exportBtn">Export</button>
        <button id="importBtn">Import</button>
        <input type="file" id="importFile" accept=".json" hidden>
      </div>
      <h2 style="margin-top:24px">Danger zone</h2>
      <button class="danger" id="wipeBtn">Delete all turfs, checklists and logs</button>
    </section>
  </aside>
</main>

<dialog id="turfDialog">
  <h3>New turf</h3>
  <label for="tName">Name</label><input id="tName" maxlength="40">
  <label for="tGang">Gang</label><input id="tGang" maxlength="30">
  <label for="tLoyalty">Current loyalty (0–1000)</label><input id="tLoyalty" type="number" min="0" max="1000" value="500">
  <label for="tColor">Map colour</label><input id="tColor" type="color" value="#4f8cff" style="padding:2px;height:34px">
  <div class="dlg-actions"><button id="turfCancel">Cancel</button><button class="primary" id="turfSave">Create</button></div>
</dialog>

<dialog id="loyaltyDialog">
  <h3 id="lTitle">Update loyalty</h3>
  <label for="lValue">New loyalty score (0–1000)</label><input id="lValue" type="number" min="0" max="1000">
  <label for="lNote">What did you do?</label><textarea id="lNote" rows="3" placeholder="e.g. Sold 50 coke, 5 sprays"></textarea>
  <div class="dlg-actions"><button id="lCancel">Cancel</button><button class="primary" id="lSave">Save</button></div>
</dialog>

<div id="toast"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
"use strict";

/* ====================== CONFIG ====================== */
const CONFIG = {
  // Firebase Realtime Database URL, e.g. "https://my-gang-default-rtdb.firebaseio.com"
  // Leave empty to store data only in this browser (nothing is shared).
  DATABASE_URL: "",

  MAP_IMAGE: "map.jpg",          // put your map image next to index.html
  MAP_WIDTH: 2000,               // map coordinate space (any size, keep the image's aspect ratio)
  MAP_HEIGHT: 2000,
  MAX_LOYALTY: 1000,
  DECAY_PER_DAY: 250,            // loyalty lost per 24h with no activity
  TASKS: ["Spray", "Sell drugs"],// daily checklist items per turf
  POLL_SECONDS: 15
};

/* ====================== HELPERS ====================== */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const uid = p => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const memberKey = name => name.replace(/[.#$\/\[\]]/g, "_");
const todayStr = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10); };

function timeAgo(ts) {
  const m = Math.floor((Date.now() - ts) / 6e4);
  if (m < 1) return "just now";
  if (m < 60) return m + "m ago";
  const h = Math.floor(m / 60);
  return h < 24 ? h + "h ago" : Math.floor(h / 24) + "d ago";
}

let toastTimer;
function toast(msg) {
  const t = $("toast"); t.textContent = msg; t.classList.add("on");
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), 2600);
}

/* ====================== STORAGE ======================
   State shape:
   turfs:  { id: { name, gang, color, poly(JSON string), loyalty, loyaltyAt } }
   checks: { "YYYY-MM-DD": { turfId: { task: { memberKey: "Display name" } } } }
   log:    { id: { t, user, turf, text } }
   Each change writes only its own path, so two people editing
   different things never overwrite each other. */
let state = { turfs: {}, checks: {}, log: {} };
const REMOTE = CONFIG.DATABASE_URL.replace(/\/$/, "");
const LOCAL_KEY = "turf_tracker_state";

function normalize(s) {
  return { turfs: s?.turfs || {}, checks: s?.checks || {}, log: s?.log || {} };
}

function setPath(path, value) {
  const keys = path.split("/");
  let node = state;
  keys.slice(0, -1).forEach(k => node = node[k] = node[k] || {});
  const last = keys[keys.length - 1];
  if (value === null) delete node[last]; else node[last] = value;
}

async function write(path, value) {
  setPath(path, value);
  if (!REMOTE) { localStorage.setItem(LOCAL_KEY, JSON.stringify(state)); return; }
  try {
    const res = await fetch(`${REMOTE}/${path}.json`, {
      method: value === null ? "DELETE" : "PUT",
      body: value === null ? undefined : JSON.stringify(value)
    });
    if (!res.ok) throw new Error(res.status);
    setSync(true);
  } catch (e) { setSync(false); toast("Could not save – check your connection"); }
}

async function load() {
  if (!REMOTE) {
    try { state = normalize(JSON.parse(localStorage.getItem(LOCAL_KEY))); } catch { state = normalize(null); }
    return;
  }
  try {
    const res = await fetch(`${REMOTE}/.json`);
    if (!res.ok) throw new Error(res.status);
    state = normalize(await res.json());
    setSync(true);
  } catch (e) { setSync(false); }
}

function setSync(ok) {
  $("syncState").textContent = !REMOTE ? "Local only" : ok ? "Synced" : "Offline";
  $("syncState").style.color = !REMOTE ? "var(--warn)" : ok ? "var(--good)" : "var(--bad)";
}

/* ====================== DOMAIN LOGIC ====================== */
let user = localStorage.getItem("turf_tracker_user") || "";
let selectedId = null;

// Loyalty is stored as "value at time X" and decays on read, so nothing needs a timer to stay accurate.
function currentLoyalty(t) {
  const lost = (Date.now() - t.loyaltyAt) / 864e5 * CONFIG.DECAY_PER_DAY;
  return Math.max(0, t.loyalty - lost);
}
const loyaltyColor = v => v >= 700 ? "var(--good)" : v >= 350 ? "var(--warn)" : "var(--bad)";
const polyOf = t => { try { return JSON.parse(t.poly); } catch { return []; } };
const sortedTurfs = () => Object.entries(state.turfs).sort((a, b) => a[1].name.localeCompare(b[1].name));

function requireUser() {
  if (user) return true;
  toast("Enter your name at the top first");
  $("userName").focus();
  return false;
}

function addLog(turf, text) {
  const id = uid("l");
  return write(`log/${id}`, { t: Date.now(), user, turf, text });
}

function toggleCheck(date, turfId, task) {
  if (!requireUser()) return;
  const path = `checks/${date}/${turfId}/${task}/${memberKey(user)}`;
  const had = !!state.checks[date]?.[turfId]?.[task]?.[memberKey(user)];
  write(path, had ? null : user);
  if (!had) addLog(state.turfs[turfId].name, `Did: ${task}`);
  renderDaily();
  renderLog();
}

/* ====================== MAP ====================== */
let map, layers = {};
let drawing = false, drawPts = [], drawMarkers = [], drawLine = null;

function initMap() {
  map = L.map("map", { crs: L.CRS.Simple, minZoom: -2, maxZoom: 3, zoomSnap: 0.25, attributionControl: false });
  const bounds = [[0, 0], [CONFIG.MAP_HEIGHT, CONFIG.MAP_WIDTH]];
  L.imageOverlay(CONFIG.MAP_IMAGE, bounds).addTo(map);
  map.fitBounds(bounds);
  map.on("click", e => {
    if (!drawing) return;
    const p = [Math.round(e.latlng.lat), Math.round(e.latlng.lng)];
    drawPts.push(p);
    drawMarkers.push(L.circleMarker(p, { radius: 5, color: "#fff", fillColor: "#4f8cff", fillOpacity: 1 }).addTo(map));
    refreshDrawLine();
  });
}

function refreshDrawLine() {
  if (drawLine) map.removeLayer(drawLine);
  drawLine = drawPts.length > 1 ? L.polyline(drawPts, { color: "#4f8cff", dashArray: "5 5" }).addTo(map) : null;
  $("drawCount").textContent = `${drawPts.length} point${drawPts.length === 1 ? "" : "s"}`;
}

function setDrawing(on) {
  drawing = on;
  $("drawBar").classList.toggle("on", on);
  $("map").classList.toggle("drawing", on);
  if (!on) {
    drawMarkers.forEach(m => map.removeLayer(m));
    drawPts = []; drawMarkers = [];
    refreshDrawLine();
  }
}

function renderMap() {
  Object.values(layers).forEach(l => map.removeLayer(l));
  layers = {};
  sortedTurfs().forEach(([id, t]) => {
    const pts = polyOf(t);
    if (pts.length < 3) return;
    const v = currentLoyalty(t);
    const poly = L.polygon(pts, {
      color: v < 350 ? "#e5484d" : t.color, weight: id === selectedId ? 4 : 2,
      fillColor: t.color, fillOpacity: 0.2 + (v / CONFIG.MAX_LOYALTY) * 0.4
    }).addTo(map);
    const tip = document.createElement("div");
    tip.innerHTML = `<strong>${esc(t.name)}</strong><br>${esc(t.gang)} · ${Math.round(v)} / ${CONFIG.MAX_LOYALTY}`;
    poly.bindTooltip(tip, { sticky: true });
    poly.on("click", () => { if (!drawing) selectTurf(id, false); });
    layers[id] = poly;
  });
}

/* ====================== RENDERING ====================== */
function renderTurfs() {
  const list = sortedTurfs();
  $("turfCount").textContent = list.length;
  if (!list.length) { $("turfList").innerHTML = `<p class="muted">No turfs yet. Click "+ Draw turf" and outline one on the map.</p>`; return; }
  $("turfList").innerHTML = list.map(([id, t]) => {
    const v = currentLoyalty(t), sel = id === selectedId;
    return `<div class="card click ${sel ? "sel" : ""}" data-id="${esc(id)}">
      <div class="row"><strong><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}</strong>
        <span style="color:${loyaltyColor(v)};font-weight:600">${Math.round(v)}</span></div>
      <div class="row muted"><span>${esc(t.gang)}</span><span>Updated ${timeAgo(t.loyaltyAt)}</span></div>
      <div class="bar"><i style="width:${v / CONFIG.MAX_LOYALTY * 100}%;background:${loyaltyColor(v)}"></i></div>
      ${sel ? `<div class="actions"><button class="small primary" data-act="loyalty">Update loyalty</button>
        <button class="small danger" data-act="delete">Delete</button></div>` : ""}
    </div>`;
  }).join("");
}

function renderDaily() {
  const date = $("dayPick").value || todayStr();
  const day = state.checks[date] || {};
  const turfs = sortedTurfs();
  const me = memberKey(user);
  let total = 0;
  const members = new Set();

  $("dailyList").innerHTML = turfs.length ? turfs.map(([id, t]) => `
    <div class="card"><strong><span class="dot" style="background:${esc(t.color)}"></span>${esc(t.name)}</strong>
      <div style="margin-top:6px">${CONFIG.TASKS.map(task => {
        const who = day[id]?.[task] || {};
        const names = Object.values(who);
        total += names.length; names.forEach(n => members.add(n));
        const mine = !!user && !!who[me];
        return `<div class="task">
          <button class="small ${mine ? "done" : ""}" data-turf="${esc(id)}" data-task="${esc(task)}">${mine ? "✓ " : ""}${esc(task)}</button>
          <div class="chips">${names.length ? names.map(n => `<span class="chip">${esc(n)}</span>`).join("") : `<span class="muted">Nobody yet</span>`}</div>
        </div>`;
      }).join("")}</div></div>`).join("")
    : `<p class="muted">Add a turf first.</p>`;

  $("daySummary").textContent = `${total} check-in${total === 1 ? "" : "s"} from ${members.size} member${members.size === 1 ? "" : "s"} on ${date}.`;
}

function renderLog() {
  const entries = Object.values(state.log).sort((a, b) => b.t - a.t).slice(0, 100);
  $("logList").innerHTML = entries.length ? entries.map(e => `
    <div class="card"><div class="row"><strong>${esc(e.user)}</strong><span class="muted">${timeAgo(e.t)}</span></div>
      <div class="muted">${esc(e.turf)}</div><div>${esc(e.text)}</div></div>`).join("")
    : `<p class="muted">Nothing logged yet.</p>`;
}

function renderAll() { renderMap(); renderTurfs(); renderDaily(); renderLog(); }

/* ====================== ACTIONS ====================== */
function selectTurf(id, zoom = true) {
  selectedId = id;
  if (zoom && layers[id]) map.fitBounds(layers[id].getBounds(), { padding: [40, 40] });
  activateTab("turfs");
  renderMap(); renderTurfs();
}

function activateTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".tab").forEach(s => s.classList.toggle("active", s.id === "tab-" + name));
}

function saveTurf() {
  const name = $("tName").value.trim();
  if (!name) return toast("Give the turf a name");
  if (!requireUser()) return;
  const id = uid("t");
  write(`turfs/${id}`, {
    name, gang: $("tGang").value.trim() || "Unknown", color: $("tColor").value,
    poly: JSON.stringify(drawPts),
    loyalty: clamp(parseInt($("tLoyalty").value) || 0, 0, CONFIG.MAX_LOYALTY), loyaltyAt: Date.now()
  });
  addLog(name, "Turf created");
  $("turfDialog").close(); setDrawing(false);
  selectedId = id; renderAll();
}

function saveLoyalty() {
  const t = state.turfs[selectedId];
  const v = parseInt($("lValue").value);
  if (!t || isNaN(v) || v < 0 || v > CONFIG.MAX_LOYALTY) return toast(`Enter a score between 0 and ${CONFIG.MAX_LOYALTY}`);
  if (!requireUser()) return;
  write(`turfs/${selectedId}/loyalty`, v);
  write(`turfs/${selectedId}/loyaltyAt`, Date.now());
  addLog(t.name, `Loyalty set to ${v}` + ($("lNote").value.trim() ? ` – ${$("lNote").value.trim()}` : ""));
  $("loyaltyDialog").close(); renderAll();
}

function deleteTurf() {
  const t = state.turfs[selectedId];
  if (!t || !confirm(`Delete "${t.name}"?`)) return;
  if (!requireUser()) return;
  write(`turfs/${selectedId}`, null);
  addLog(t.name, "Turf deleted");
  selectedId = null; renderAll();
}

function exportData() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(state, null, 2)], { type: "application/json" }));
  a.download = `turf-tracker-${todayStr()}.json`;
  a.click(); URL.revokeObjectURL(a.href);
}

async function importData(file) {
  try {
    const data = normalize(JSON.parse(await file.text()));
    if (!confirm("This replaces all current data. Continue?")) return;
    for (const k of ["turfs", "checks", "log"]) await write(k, data[k]);
    renderAll(); toast("Imported");
  } catch { toast("That file isn't valid backup data"); }
}

async function wipeAll() {
  if (!confirm("Delete ALL turfs, checklists and logs for everyone?")) return;
  for (const k of ["turfs", "checks", "log"]) await write(k, null);
  selectedId = null; renderAll();
}

/* ====================== EVENTS ====================== */
function bind() {
  $("userName").value = user;
  $("userName").addEventListener("change", e => {
    user = e.target.value.trim();
    localStorage.setItem("turf_tracker_user", user);
    renderDaily();
  });

  $("tabs").addEventListener("click", e => e.target.dataset.tab && activateTab(e.target.dataset.tab));

  $("turfList").addEventListener("click", e => {
    const card = e.target.closest(".card"); if (!card) return;
    const act = e.target.dataset.act;
    if (act === "loyalty") {
      const t = state.turfs[selectedId];
      $("lTitle").textContent = t.name; $("lValue").value = Math.round(currentLoyalty(t)); $("lNote").value = "";
      $("loyaltyDialog").showModal();
    } else if (act === "delete") deleteTurf();
    else selectTurf(card.dataset.id);
  });

  $("dailyList").addEventListener("click", e => {
    const b = e.target.closest("button[data-task]");
    if (b) toggleCheck($("dayPick").value || todayStr(), b.dataset.turf, b.dataset.task);
  });
  $("dayPick").value = todayStr();
  $("dayPick").addEventListener("change", renderDaily);

  $("drawStart").onclick = () => { setDrawing(true); toast("Click the map to place points"); };
  $("drawUndo").onclick = () => { drawPts.pop(); const m = drawMarkers.pop(); if (m) map.removeLayer(m); refreshDrawLine(); };
  $("drawCancel").onclick = () => setDrawing(false);
  $("drawFinish").onclick = () => {
    if (drawPts.length < 3) return toast("A turf needs at least 3 points");
    $("tName").value = ""; $("tGang").value = ""; $("turfDialog").showModal();
  };
  $("turfSave").onclick = saveTurf;
  $("turfCancel").onclick = () => $("turfDialog").close();
  $("lSave").onclick = saveLoyalty;
  $("lCancel").onclick = () => $("loyaltyDialog").close();

  $("exportBtn").onclick = exportData;
  $("importBtn").onclick = () => $("importFile").click();
  $("importFile").onchange = e => { if (e.target.files[0]) importData(e.target.files[0]); e.target.value = ""; };
  $("wipeBtn").onclick = wipeAll;
}

/* ====================== START ====================== */
(async function start() {
  initMap();
  bind();
  setSync(true);
  await load();
  renderAll();
  // Pull other members' changes and re-apply decay.
  setInterval(async () => { await load(); renderAll(); }, CONFIG.POLL_SECONDS * 1000);
})();
</script>
